name: Update Swagger UI

permissions:
  contents: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  updateSwagger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest Swagger UI release
        id: swagger-ui
        run: |
          release_tag=$(curl -fsSL https://api.github.com/repos/swagger-api/swagger-ui/releases/latest | jq -r ".tag_name")
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          current_tag=$(cat swagger-ui.version)
          echo "current_tag=$current_tag" >> "$GITHUB_OUTPUT"

      - name: Update Swagger UI
        if: steps.swagger-ui.outputs.current_tag != steps.swagger-ui.outputs.release_tag
        env:
          RELEASE_TAG: ${{ steps.swagger-ui.outputs.release_tag }}
          SWAGGER_YAML: swagger.yaml
        run: |
          set -e

          rm -rf dist index.html

          curl -fsSL \
            -o swagger-ui.tar.gz \
            https://api.github.com/repos/swagger-api/swagger-ui/tarball/${RELEASE_TAG}

          ROOT=$(tar -tzf swagger-ui.tar.gz | head -1 | cut -d/ -f1)

          tar -xzf swagger-ui.tar.gz \
            --strip-components=1 \
            ${ROOT}/dist

          rm swagger-ui.tar.gz

          mv dist/index.html .

          sed -i "s|https://petstore.swagger.io/v2/swagger.json|${SWAGGER_YAML}|g" dist/swagger-initializer.js
          sed -i 's|href="./|href="dist/|g' index.html
          sed -i 's|src="./|src="dist/|g' index.html
          sed -i 's|href="index|href="dist/index|g' index.html

          echo "${RELEASE_TAG}" > swagger-ui.version

      - name: Commit updated Swagger UI
        if: steps.swagger-ui.outputs.current_tag != steps.swagger-ui.outputs.release_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist index.html swagger-ui.version

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Swagger UI to ${{ steps.swagger-ui.outputs.release_tag }}"
          git push
